<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos - Vinícius Gregório</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/scripts.js"></script>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">Vinícius Gregório</div>
            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="curriculo.html">Currículo</a></li>
                    <li><a href="formulario.html">Formulário</a></li>
                    <li><a href="multimidia.html">Multimídia</a></li>
                    <li><a href="graficos.html" aria-current="page">Gráficos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="pagina-simples" style="max-width: 900px;">
        <section class="card">
            <h1>Gráficos</h1>
            <p>As mesmas formas geométricas desenhadas de duas maneiras: <strong>Canvas</strong> (programático, via JavaScript) e <strong>SVG</strong> (vetorial, em XML).</p>
            <div class="graficos-grid">
                <div class="grafico-item">
                    <h3>Canvas</h3>
                    <canvas id="meu-canvas" width="400" height="300" aria-label="Retângulo, círculo e triângulo desenhados em Canvas" role="img"></canvas>
                </div>
                <div class="grafico-item">
                    <h3>SVG</h3>
                    <svg viewBox="0 0 400 300" role="img" aria-label="Retângulo, círculo e polígono desenhados em SVG">
                        <rect class="forma-retangulo" x="20" y="20" width="140" height="90"/>
                        <circle class="forma-circulo" cx="260" cy="65" r="45"/>
                        <polygon class="forma-poligono" points="90,270 150,150 210,270"/>
                    </svg>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Feito por Vinícius Gregório</p>
        <p>Mogi das Cruzes, SP — 2026</p>
    </footer>

</body>
